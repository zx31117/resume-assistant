<!doctype html>
<html lang="zh-CN" data-theme="A"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'none'">
<title>简历助手 · Design 工作稿</title><link rel="stylesheet" href="assets/theme-tokens.css"><link rel="stylesheet" href="assets/workbench.css"><script src="assets/app.js" defer></script></head>
<body><a class="skip" href="#main-title">跳到当前任务</a>
<header class="topbar"><div class="topbar-left"><div class="avatar-wrap"><button id="avatar" class="avatar-button" aria-haspopup="menu" aria-expanded="false" aria-controls="personal-menu"><span class="avatar-symbol" aria-hidden="true">我</span><span>我的</span><span aria-hidden="true">⌄</span></button>
<div id="personal-menu" class="menu" role="menu" aria-label="我的" hidden><p class="menu-caption">个人工作区 <span>本机</span></p>
<button role="menuitem" data-action="experiences"><span>▤</span><span>我的经历<small>查看、补充与纠正事实</small></span><span>›</span></button>
<button role="menuitem" data-action="records"><span>▧</span><span>我的简历<small>已生成的简历与文件</small></span><span>›</span></button>
<button role="menuitem" data-action="privacy"><span>◎</span><span>个人与隐私<small>本次身份、数据使用边界</small></span><span>›</span></button>
<div class="menu-divider"></div><button role="menuitem" data-action="workbench">← 返回当前生成任务</button></div></div></div><a class="brand" href="#workbench" data-action="workbench" aria-label="简历助手 · 返回工作台"><span class="brand-mark" aria-hidden="true">▤</span><span>简历助手<small>RESUME ASSISTANT</small></span></a><div class="topbar-right"><div id="top-status" class="top-status" role="status">正在读取任务…</div><button id="top-new-task" class="btn ghost" data-action="new-task">＋ 开始新任务</button><button id="top-back" class="btn ghost" data-action="workbench" hidden>← 返回工作台</button></div></header>
<main id="app"><div class="boot">正在打开工作台…</div></main>
<footer class="review-strip"><span><strong>Design 工作稿</strong> · 虚构资料 · 本地状态模拟</span><span id="review-hint">请仅输入设计反馈，不要填写真实个人资料</span><button id="annotation-toggle" class="text-button" aria-pressed="false">批注模式 · <span id="annotation-count">0</span></button><button id="review-toggle" class="text-button">评审场景 ⌃</button></footer>
<section id="review-panel" class="review-panel" aria-label="设计评审工具" hidden><div><strong>D-003 · 设计评审</strong><small>深链停在代表性时刻，点击“演示推进”继续。</small></div><label>场景 <select id="scenario-select"></select></label><label>主题 <select id="theme-select"><option value="A">A · 深松绿</option><option value="B">B · 暖纸</option><option value="C">C · 深色</option></select></label><button class="btn secondary" data-action="demo-play">演示推进 / 暂停</button><button class="btn secondary" data-action="demo-next">下一阶段</button><button class="btn secondary" data-action="demo-fill">填入虚构示例</button><button class="btn ghost" id="review-close">收起</button></section>
<aside id="annotation-panel" class="annotation-panel" aria-labelledby="annotation-title" hidden><header><div><span class="eyebrow">DESIGN REVIEW</span><h2 id="annotation-title">界面批注</h2></div><button id="annotation-close" class="btn ghost" aria-label="关闭批注面板">关闭</button></header><div class="annotation-help"><strong id="annotation-target-name">开启批注模式后，点击任意组件</strong><p id="annotation-target-meta">点击只会选择组件，不会触发原操作。</p></div><form id="annotation-form"><label for="annotation-text">批注意见</label><textarea id="annotation-text" maxlength="4000" placeholder="例如：这里的主次关系不清楚，希望按钮更突出。"></textarea><div class="annotation-form-actions"><button type="button" id="annotation-cancel" class="btn ghost">取消选择</button><button type="submit" id="annotation-save" class="btn primary">保存批注</button></div></form><div class="annotation-list-head"><strong>本轮批注</strong><button id="annotation-export" class="text-button">复制全部</button></div><div id="annotation-list" class="annotation-list"></div></aside><div id="annotation-layer" class="annotation-layer" aria-live="polite"></div>
<dialog id="modal" aria-labelledby="modal-title"><div class="dialog-head"><span class="eyebrow">当前任务</span><h2 id="modal-title"></h2></div><div id="modal-body" class="dialog-body"></div><div id="modal-actions" class="dialog-actions"></div></dialog><div id="toast" class="toast" role="status" hidden></div>
</body></html>
